<!DOCTYPE html>
<html lang="en" class="auth-html">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In</title>
  <meta name="description" content="Sign in to continue to your AutoDrive account.">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/webp" href="assets/images/logo-stackly-mint.webp">
</head>
<body class="auth-page-body">

  <div class="auth-layout">
    <!-- Left Column: Lady Justice with Gavel Image -->
    <div class="auth-media-side">
      <img src="assets/images/auth-statue.webp" alt="Lady Justice statue with wooden judge gavel" width="654" height="1522">
    </div>

    <!-- Right Column: Sign In Form -->
    <div class="auth-form-side">
      <a href="index.html" class="auth-back-home" title="Back to Home">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
        <span>Back to Home</span>
      </a>

      <div class="auth-form-box">
        <div class="auth-header">
          <a href="index.html" title="Stackly Home" style="display: inline-block;">
            <img src="assets/images/logo-stackly-mint.webp" alt="Stackly" class="auth-brand-logo">
          </a>
          <h1>Sign In</h1>
          <p>Sign in to continue to your Stackly account.</p>
        </div>

        <!-- Role Selector -->
        <div class="role-select-title">Select Your Role</div>
        <div class="role-toggle-grid">
          <button type="button" class="role-card-btn active" data-role="client">
            <div class="role-icon-box">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
              </svg>
            </div>
            <div class="role-text-info">
              <strong>client</strong>
              <span>Appoinments</span>
            </div>
          </button>

          <button type="button" class="role-card-btn" data-role="advocate">
            <div class="role-icon-box">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect>
                <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path>
              </svg>
            </div>
            <div class="role-text-info">
              <strong>Advocate</strong>
              <span>Customer &amp; Server</span>
            </div>
          </button>
        </div>

        <!-- Sign In Form -->
        <form id="signInPageForm">
          <div class="form-group">
            <label for="siEmail" class="auth-field-label">Email Address</label>
            <div class="input-with-icon-wrap">
              <span class="input-prefix-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                  <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                  <polyline points="22,6 12,13 2,6"></polyline>
                </svg>
              </span>
              <input type="email" id="siEmail" placeholder="Enter your email address" required autocomplete="email">
            </div>
            <div id="siEmailError" class="auth-error-msg" style="display:none; color: #ef4444; font-size: 0.8rem; margin-top: 6px;"></div>
          </div>

          <div class="form-group">
            <label for="siPass" class="auth-field-label">Password</label>
            <div class="input-with-icon-wrap">
              <span class="input-prefix-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                  <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                  <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
              </span>
              <input type="password" id="siPass" placeholder="Enter your password" required autocomplete="current-password">
            </div>
            <div id="siPassError" class="auth-error-msg" style="display:none; color: #ef4444; font-size: 0.8rem; margin-top: 6px;"></div>
          </div>

          <div class="auth-remember-row">
            <label class="auth-circle-check-label">
              <input type="checkbox" checked id="siRemember">
              <span class="custom-circle-check"></span>
              <span class="check-text">Remember Me</span>
            </label>
            <a href="#" class="forgot-pass-link">Forgot Password?</a>
          </div>

          <button type="submit" class="auth-submit-btn">Sign In &rarr;</button>

          <div class="auth-divider-line">
            <span class="divider-text">Or</span>
          </div>

          <!-- Social Buttons -->
          <div class="social-login-flex">
            <a href="404.html" class="social-login-btn">
              <svg width="18" height="18" viewBox="0 0 24 24">
                <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z"/>
                <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.24v3.15C3.26 21.43 7.32 24 12 24z"/>
                <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.24C.45 8.16 0 9.94 0 12s.45 3.84 1.24 5.42l4.04-3.15z"/>
                <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.32 0 3.26 2.57 1.24 6.58l4.04 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
              </svg>
              <span>Continue With Google</span>
            </a>

            <a href="404.html" class="social-login-btn">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.37c.62-.75 1.04-1.8 1.01-2.87-.96.04-2.12.64-2.79 1.43-.58.68-1.09 1.77-.96 2.81 1.07.08 2.14-.58 2.74-1.37z"/>
              </svg>
              <span>Continue With Apple</span>
            </a>
          </div>

          <p class="auth-footer-prompt">
            Don't have an account? <a href="signup.html">Create Account</a>
          </p>
        </form>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
